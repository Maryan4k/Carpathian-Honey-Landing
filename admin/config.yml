backend:
  name: git-gateway
  branch: main
media_folder: "img/uploads"
public_folder: "img/uploads"

collections:
  - name: "site_settings"
    label: "Налаштування сайту"
    files:
      - file: "_data/site.json"
        label: "Загальні"
        name: "general"
        fields:
          - label: "Заголовок сайту"
            name: "site_title"
            widget: "string"
